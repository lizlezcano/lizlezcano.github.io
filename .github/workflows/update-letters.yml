name: Update Substack letters

on:
  schedule:
    - cron: "0 11 * * *" # daily, 08:00 Paraguay
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_letters.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/letters.json; then
            echo "No new letters."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/letters.json
          git commit -m "chore: update Substack letters"
          git push
